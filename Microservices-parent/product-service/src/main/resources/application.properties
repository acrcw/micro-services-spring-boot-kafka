#spring.data.mongodb.host=localhost
#spring.data.mongodb.port=27017
spring.data.mongodb.uri=mongodb://joban:joban@localhost:27017/
spring.data.mongodb.database=Products


#grpc.server.port=${PORT:0}
grpc.server.port=8089
server.port=${grpc.server.port}

spring.application.name=product-service

eureka.client.serviceUrl.defaultZone= http://localhost:8761/eureka
eureka.instance.instance-id=${spring.application.name}:${spring.application.instance_id:${random.value}}
eureka.instance.non-secure-port-enabled=true
eureka.instance.secure-port-enabled=false
eureka.instance.non-secure-port=${grpc.server.port}

springdoc.api-docs.groups.enabled=true
springdoc.api-docs.path=/product-service/v3/api-docs
springdoc.swagger-ui.path=/product-service/swagger-ui

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=inventoryChangedConsumerId
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# activate hidden actuator endpoints
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# to populate info endpoint
management.info.env.enabled=true
info.app.name=product-service
info.app.description=Product-Service
info.app.version=1

# to enable shutdown endpoint in actuator
#management.endpoint.shutdown.enabled=true

# enable graceful shutdown from actuator endpoint
server.shutdown=graceful
# gracefull shutdown means all the ongoing request will completed and then the server will shutdown


# trace every request | in prod reduce sampling rate to 0.6
management.tracing.sampling.probability=1.0

