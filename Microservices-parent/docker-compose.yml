  product-service:
    image: acrcw/product-service:kafka
    build:
      context: ./product-service
    container_name: product-service
    depends_on:
      - eureka-service
      - mongo-db
    environment:
      - GRPC_SERVER_PORT=8080
      - SPRING_DATA_MONGODB_URI=mongodb://joban:joban@mongo-db:27017/
      - SPRING_DATA_MONGODB_DATABASE=Products
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-service:8761/eureka

      # 🔑 AWS MSK SERVERLESS
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=b-1.otelprometheusintegra.6ngfgi.c3.kafka.ap-south-1.amazonaws.com:9094,b-2.otelprometheusintegra.6ngfgi.c3.kafka.ap-south-1.amazonaws.com:9094
      # - SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL=SASL_SSL
      # - SPRING_KAFKA_PROPERTIES_SASL_MECHANISM=AWS_MSK_IAM
      # - SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG=software.amazon.msk.auth.iam.IAMLoginModule required;
      # - SPRING_KAFKA_PROPERTIES_SASL_CLIENT_CALLBACK_HANDLER_CLASS=software.amazon.msk.auth.iam.IAMClientCallbackHandler
      # - AWS_REGION=ap-south-1

      - OTEL_EXPORTER_OTLP_ENDPOINT=http://opentelemetry-collector:4318
      - OTEL_SERVICE_NAME=product-service
    networks:
      - microservicenetwork


  user-service:
    image: acrcw/user-service:kafka
    build:
      context: ./user-service
    container_name: user-service
    depends_on:
      - eureka-service
      - mongo-db
    environment:
      - GRPC_SERVER_PORT=8080
      - SPRING_DATA_MONGODB_URI=mongodb://joban:joban@mongo-db:27017/
      - SPRING_DATA_MONGODB_DATABASE=Users
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-service:8761/eureka

      # 🔑 AWS MSK SERVERLESS
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=b-1.otelprometheusintegra.6ngfgi.c3.kafka.ap-south-1.amazonaws.com:9094,b-2.otelprometheusintegra.6ngfgi.c3.kafka.ap-south-1.amazonaws.com:9094
      # - SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL=SASL_SSL
      # - SPRING_KAFKA_PROPERTIES_SASL_MECHANISM=AWS_MSK_IAM
      # - SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG=software.amazon.msk.auth.iam.IAMLoginModule required;
      # - SPRING_KAFKA_PROPERTIES_SASL_CLIENT_CALLBACK_HANDLER_CLASS=software.amazon.msk.auth.iam.IAMClientCallbackHandler
      # - AWS_REGION=ap-south-1

      - OTEL_EXPORTER_OTLP_ENDPOINT=http://opentelemetry-collector:4318
      - OTEL_SERVICE_NAME=user-service
    networks:
      - microservicenetwork


  eureka-service:
    image: acrcw/eureka-service:kafka
    build:
      context: ./discovery-server
    container_name: eureka-service
    environment:
      - SERVER_PORT=8761
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://opentelemetry-collector:4318
      - OTEL_SERVICE_NAME=eureka-service
    ports:
      - "8761:8761"
    networks:
      - microservicenetwork


  API-Gateway-service:
    image: acrcw/api-gateway:kafka
    build:
      context: ./api-gateway
    container_name: API-Gateway-service
    depends_on:
      - eureka-service
    environment:
      - GRPC_SERVER_PORT=8080
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-service:8761/eureka
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://opentelemetry-collector:4318
      - OTEL_SERVICE_NAME=API-Gateway-service
    ports:
      - "8080:8080"
    networks:
      - microservicenetwork


  opentelemetry-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: opentelemetry-collector
    restart: unless-stopped
    volumes:
      - ./otel_config.yaml:/etc/otelcol-contrib/config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8888:8888"
      - "8889:8889"
      - "13133:13133"
    networks:
      - microservicenetwork


networks:
  microservicenetwork:
    driver: bridge


volumes:
  mongodb_data_container:
  mysql-data:
