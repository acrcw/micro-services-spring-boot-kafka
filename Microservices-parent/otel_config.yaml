receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

exporters:
  otlphttp/newrelic:
    endpoint: https://otlp.nr-data.net
    headers:
      api-key: "d1f0c43fe27c1e30bc858a947f4b2da8FFFFNRAL"


  debug:
    verbosity: detailed
service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [otlphttp/newrelic]
    metrics:
      receivers: [otlp]
      exporters: [otlphttp/newrelic]
    logs:
      receivers: [otlp]
      exporters: [otlphttp/newrelic]
 