otel.exporter.otlp.endpoint = http://0.0.0.0:45381
otel.exporter.otlp.timeout = 5000
otel.jmx.config = /otel/kafka-jmx-config.yaml
otel.jmx.service.url = service:jmx:rmi:///jndi/rmi://kafka:9999/jmxrmi
otel.jmx.target.source = auto
otel.jmx.target.system = kafka
otel.metric.export.interval = 30s
otel.metrics.exporter = otlp
otel.resource.attributes = broker.endpoint=kafka:9999,broker.id=1