extensions:
  health_check: {}
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: otel-collector:4317
      http:
        endpoint: otel-collector:4318
processors:
  batch:
  # Will convert all monotonic, cumulative sums to monotonic, delta sums
  cumulativetodelta:
  transform:
    trace_statements:
      - truncate_all(span.attributes, 4095)
      - truncate_all(resource.attributes, 4095)
    log_statements:
      - truncate_all(log.attributes, 4095)
      - truncate_all(resource.attributes, 4095)
    metric_statements:
      - truncate_all(datapoint.attributes, 4095)
      - truncate_all(resource.attributes, 4095)
exporters:
  debug:
    verbosity: detailed
  otlphttp:
    endpoint: https://otlp.nr-data.net
    headers:
      api-key:
service:
  extensions: [health_check]
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [cumulativetodelta, transform, batch]
      exporters: [debug, otlphttp]
    traces:
      receivers: [otlp]
      processors: [transform, batch]
      exporters: [debug, otlphttp]
    logs:
      receivers: [otlp, fluentforward]
      processors: [transform, batch]
      exporters: [debug, otlphttp]