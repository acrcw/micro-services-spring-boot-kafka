receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

exporters:
  otlphttp/newrelic:
    endpoint: https://otlp.nr-data.net:4318
    headers:
      api-key: "" #joban new relic account

   
  debug:
    verbosity: detailed 
service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [otlphttp/newrelic, debug]
    metrics:
      receivers: [otlp]
      exporters: [otlphttp/newrelic]
    logs:
      receivers: [otlp]
      exporters: [otlphttp/newrelic]
 